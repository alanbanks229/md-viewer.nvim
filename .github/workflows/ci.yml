name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.4
  STYLUA_VERSION: v2.5.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: |
          curl -fsSL -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua
          rm stylua.zip

      - name: Check Lua formatting
        run: stylua --check lua/ plugin/ tests/lua/

  # TEMPORARY: isolates which browser build / launch argument wedges on the
  # macOS runners. Removed once the macos-latest hang is understood.
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install locked renderer dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --prefix renderer

      - name: Report installed browsers
        run: |
          sw_vers
          uname -m
          ls -d /Applications/*.app
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true
          "/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" --version || true

      - name: Chromium launch diagnostic
        run: node renderer/scripts/chromium-launch-diagnostic.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64) asset=nvim-macos-arm64.tar.gz ;;
            *) asset=nvim-macos-x86_64.tar.gz ;;
          esac
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/${asset}"
          tar xzf nvim.tar.gz
          echo "$PWD/${asset%.tar.gz}/bin" >> "$GITHUB_PATH"

      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install locked renderer dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --prefix renderer

      - name: Check Neovim version
        run: nvim --version

      - name: Run Lua tests
        run: NVIM_APPNAME=md-viewer-tests nvim --headless -u NONE -i NONE -l tests/lua/run.lua

      - name: Run Node.js tests
        run: npm test --prefix renderer
