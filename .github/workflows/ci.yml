name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.4
  STYLUA_VERSION: v2.5.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: |
          curl -fsSL -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua
          rm stylua.zip

      - name: Check Lua formatting
        run: stylua --check build.lua lua/ plugin/ tests/lua/

  test:
    # Explicit cells rather than a product: the documented floor is Node 22.12,
    # so it has to be exercised somewhere, and both operating systems have to be
    # covered -- but the OS x version product buys a fourth cell that proves
    # nothing the other three do not.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.12.0
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24

    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64) asset=nvim-macos-arm64.tar.gz ;;
            *) asset=nvim-macos-x86_64.tar.gz ;;
          esac
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/${asset}"
          tar xzf nvim.tar.gz
          echo "$PWD/${asset%.tar.gz}/bin" >> "$GITHUB_PATH"

      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install locked renderer dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --prefix renderer

      - name: Check Neovim version
        run: nvim --version

      - name: Run Lua tests
        run: NVIM_APPNAME=md-viewer-tests nvim --headless -u NONE -i NONE -l tests/lua/run.lua

      - name: Run Node.js tests
        run: npm test --prefix renderer
