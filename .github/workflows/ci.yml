name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install Neovim
        run: brew install neovim
      - name: Install locked renderer dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --prefix renderer
      - name: Check Neovim version
        run: nvim --version
      - name: Run Lua tests
        run: NVIM_APPNAME=md-viewer-tests nvim --headless -u NONE -i NONE -l tests/lua/run.lua
      - name: Run Node.js tests
        run: npm test --prefix renderer
