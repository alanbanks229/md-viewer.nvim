name: Bug report
description: Something in md-viewer.nvim is not working right
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect to see?
    validations:
      required: true
  - type: input
    attributes:
      label: Terminal and version
      placeholder: "e.g. Ghostty 1.3.1, iTerm2 3.5.2, Kitty 0.36"
    validations:
      required: true
  - type: input
    attributes:
      label: OS
      placeholder: "e.g. macOS 15.5, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    attributes:
      label: Neovim version
      placeholder: "e.g. 0.12.4"
    validations:
      required: true
  - type: textarea
    attributes:
      label: ":MdViewerDebug output"
      description: Please paste it if you can — it answers most environment questions in one go (versions, backend, terminal detection). Remove any paths you consider sensitive. If md-viewer fails before the command works, just say so here.
      render: text
  - type: textarea
    attributes:
      label: How can we reproduce it?
      description: Steps, minimal config, or a snippet of Markdown that triggers it — whatever you have.
  - type: textarea
    attributes:
      label: Screenshot or recording
      description: For anything visual (wrong placement, flicker, artifacts), a screenshot or short recording is the most useful evidence.
